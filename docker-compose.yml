name: laravel-starterkit

services:
  app:
    build:
      context: ./docker/services/app
      dockerfile: app.dockerfile
    environment:
      PUID: ${HOST_UID:-1000}
      PGID: ${HOST_GID:-1000}
    volumes:
      - ./src:/var/www
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./docker/services/web
      dockerfile: web.dockerfile
    volumes:
      - ./src:/var/www:ro
    depends_on:
      - app
    ports:
      - "${APP_PORT:-8000}:80"

  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_USER: ${DB_USERNAME:-laravel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "${FORWARD_MAIL_PORT:-8025}:8025"
      - "${FORWARD_SMTP_PORT:-1025}:1025"

  phpmyadmin:
    image: phpmyadmin:5-apache
    profiles: ["tools"]
    environment:
      PMA_HOST: database
      PMA_PORT: 3306
      PMA_USER: ${DB_USERNAME:-laravel}
      PMA_PASSWORD: ${DB_PASSWORD:-secret}
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "${PMA_PORT:-8888}:80"

volumes:
  mysql_data:
  redis_data:
